[project]
name = "collections-orchestration"
version = "0.1.0"
description = "Real-time collections orchestration engine with AI agents"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.7.1",
    "aiokafka>=0.11.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.40.0",
    "websockets>=13.1",
    "rich>=13.9.0",
    "faker>=33.0.0",
    "orjson>=3.10.0",
]

[tool.uv]
required-version = ">=0.4.0"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
