[project]
name = "{{engagement_slug}}"
version = "0.1.0"
description = "{{engagement_description}}"
requires-python = ">=3.12"

dependencies = [
    # Workflow engine
    "temporalio>=1.7",          # if workflow_engine == temporal
    # Event bus (Kafka)
    "aiokafka>=0.11",           # if event_bus == kafka
    "orjson>=3.10",
    # OLTP database (Postgres)
    "asyncpg>=0.30",            # if oltp == postgres
    "sqlalchemy[asyncio]>=2.0",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Web client + WebSocket
    "httpx>=0.27",
    "websockets>=13.1",
    # Models
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    # LLM provider (Anthropic direct)
    "anthropic>=0.40",          # if llm == anthropic-direct
    # Lakehouse
    "aioboto3>=12.0",           # if lakehouse target == AWS S3
    "pyarrow>=15.0",
    "duckdb>=0.10",
    # ML
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    # Misc
    "python-dotenv>=1.0",
    "redis[hiredis]>=5.2",
    "rich>=13.9",
    "faker>=33.0",
]

[tool.uv]
required-version = ">=0.4"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
